<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100%" height="100%">
  <defs>
    <radialGradient id="sunGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#FFF275"/>
      <stop offset="50%" stop-color="#FFD166"/>
      <stop offset="85%" stop-color="#F77F00"/>
      <stop offset="100%" stop-color="#D62828"/>
    </radialGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>
  <!-- Rayos solares -->
  <g stroke="#FFD166" stroke-width="3" stroke-linecap="round" opacity="0.8">
    <line x1="50" y1="6" x2="50" y2="16"/>
    <line x1="50" y1="84" x2="50" y2="94"/>
    <line x1="6" y1="50" x2="16" y2="50"/>
    <line x1="84" y1="50" x2="94" y2="50"/>
    <line x1="19" y1="19" x2="26" y2="26"/>
    <line x1="74" y1="74" x2="81" y2="81"/>
    <line x1="19" y1="81" x2="26" y2="74"/>
    <line x1="74" y1="26" x2="81" y2="19"/>
  </g>
  <!-- Corona / Halo exterior -->
  <circle cx="50" cy="50" r="34" fill="#FFD166" opacity="0.3" filter="url(#glow)"/>
  <!-- Cuerpo del Sol -->
  <circle cx="50" cy="50" r="28" fill="url(#sunGlow)"/>
  <!-- Manchas solares o textura -->
  <circle cx="42" cy="40" r="3" fill="#D62828" opacity="0.25"/>
  <circle cx="60" cy="46" r="2" fill="#D62828" opacity="0.25"/>
  <circle cx="48" cy="62" r="3.5" fill="#D62828" opacity="0.2"/>
</svg>
