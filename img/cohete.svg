<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 120" width="100%" height="100%">
  <defs>
    <linearGradient id="rocketBody" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="60%" stop-color="#E2E8F0"/>
      <stop offset="100%" stop-color="#CBD5E1"/>
    </linearGradient>
    <linearGradient id="fireGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFF275"/>
      <stop offset="40%" stop-color="#FFD166"/>
      <stop offset="70%" stop-color="#F77F00"/>
      <stop offset="100%" stop-color="#D62828"/>
    </linearGradient>
  </defs>

  <!-- Llama de propulsión -->
  <path d="M 40 85 Q 50 118, 50 118 Q 50 118, 60 85 Z" fill="url(#fireGrad)"/>
  <path d="M 44 85 Q 50 105, 50 105 Q 50 105, 56 85 Z" fill="#FFF275"/>

  <!-- Alerones / Aletas laterales moradas -->
  <path d="M 32 60 L 16 82 L 32 82 Z" fill="#5B4BCE"/>
  <path d="M 68 60 L 84 82 L 68 82 Z" fill="#5B4BCE"/>
  <!-- Aleta central -->
  <rect x="48" y="65" width="4" height="20" fill="#5B4BCE" rx="2"/>

  <!-- Boquilla del cohete -->
  <rect x="40" y="80" width="20" height="7" rx="3" fill="#2D3748"/>

  <!-- Cuerpo del cohete -->
  <path d="M 50 8 C 30 35, 30 78, 30 80 L 70 80 C 70 78, 70 35, 50 8 Z" fill="url(#rocketBody)"/>

  <!-- Punta / Cono de morado -->
  <path d="M 50 8 C 42 22, 38 30, 37 34 L 63 34 C 62 30, 58 22, 50 8 Z" fill="#5B4BCE"/>

  <!-- Ventana / Escotilla -->
  <circle cx="50" cy="48" r="11" fill="#5B4BCE"/>
  <circle cx="50" cy="48" r="9" fill="#48CAE4"/>
  <!-- Reflejo ventana -->
  <path d="M 45 42 A 6 6 0 0 1 54 42" stroke="#FFFFFF" stroke-width="2" stroke-linecap="round" fill="none"/>

  <!-- Detalle amarillo -->
  <rect x="33" y="74" width="34" height="4" fill="#FFD166"/>
</svg>
