<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 100" width="100%" height="100%">
  <defs>
    <radialGradient id="satGrad" cx="35%" cy="35%" r="65%">
      <stop offset="0%" stop-color="#FFEBB4"/>
      <stop offset="50%" stop-color="#E5C158"/>
      <stop offset="100%" stop-color="#9E782F"/>
    </radialGradient>
    <clipPath id="satBodyClip">
      <circle cx="60" cy="50" r="28"/>
    </clipPath>
  </defs>
  
  <!-- Anillo parte trasera -->
  <g transform="rotate(-18 60 50)">
    <ellipse cx="60" cy="50" rx="55" ry="14" fill="none" stroke="#D4AF37" stroke-width="8" opacity="0.8"/>
    <ellipse cx="60" cy="50" rx="46" ry="11" fill="none" stroke="#FFD166" stroke-width="4" opacity="0.9"/>
  </g>

  <!-- Planeta Saturno -->
  <circle cx="60" cy="50" r="28" fill="url(#satGrad)"/>
  
  <!-- Franjas sutiles en el planeta -->
  <g clip-path="url(#satBodyClip)" opacity="0.4">
    <line x1="20" y1="42" x2="100" y2="42" stroke="#B8860B" stroke-width="3"/>
    <line x1="20" y1="52" x2="100" y2="52" stroke="#FFF" stroke-width="2"/>
    <line x1="20" y1="58" x2="100" y2="58" stroke="#B8860B" stroke-width="4"/>
  </g>

  <!-- Anillo parte frontal (superpuesta al frente del planeta) -->
  <g transform="rotate(-18 60 50)">
    <!-- Recorte para mostrar solo la mitad inferior frontal del anillo -->
    <path d="M 5 50 A 55 14 0 0 0 115 50" fill="none" stroke="#E5C158" stroke-width="8" opacity="0.95"/>
    <path d="M 14 50 A 46 11 0 0 0 106 50" fill="none" stroke="#FFD166" stroke-width="4" opacity="0.95"/>
    <!-- División de Cassini -->
    <path d="M 10 50 A 50 12.5 0 0 0 110 50" fill="none" stroke="#101B3F" stroke-width="1.2" opacity="0.7"/>
  </g>

  <!-- Brillo -->
  <path d="M 42 36 A 26 26 0 0 1 68 24 A 26 26 0 0 0 42 36 Z" fill="#FFFFFF" opacity="0.3"/>
</svg>
