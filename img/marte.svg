<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100%" height="100%">
  <defs>
    <radialGradient id="marsGrad" cx="35%" cy="35%" r="65%">
      <stop offset="0%" stop-color="#FF7B54"/>
      <stop offset="60%" stop-color="#E23E1D"/>
      <stop offset="100%" stop-color="#7B1E05"/>
    </radialGradient>
    <clipPath id="marsClip">
      <circle cx="50" cy="50" r="32"/>
    </clipPath>
  </defs>
  <!-- Planeta Marte -->
  <circle cx="50" cy="50" r="32" fill="url(#marsGrad)"/>
  <!-- Detalles, cañones y cráteres -->
  <g clip-path="url(#marsClip)">
    <!-- Casquete polar norte de hielo -->
    <ellipse cx="50" cy="20" rx="14" ry="4" fill="#FFFFFF" opacity="0.9"/>
    <!-- Monte Olimpo (volcán gigante) -->
    <circle cx="62" cy="42" r="5" fill="#B32D0F" stroke="#7B1E05" stroke-width="1"/>
    <circle cx="62" cy="42" r="2" fill="#7B1E05"/>
    <!-- Valle Marineris (cañón) -->
    <path d="M 32 54 Q 48 57, 68 52" stroke="#7B1E05" stroke-width="3" stroke-linecap="round" fill="none"/>
    <path d="M 36 60 Q 52 62, 64 58" stroke="#7B1E05" stroke-width="2" stroke-linecap="round" fill="none"/>
    <!-- Cráteres -->
    <circle cx="36" cy="40" r="3" fill="#7B1E05" opacity="0.7"/>
    <circle cx="46" cy="70" r="4.5" fill="#7B1E05" opacity="0.6"/>
    <!-- Casquete polar sur -->
    <ellipse cx="50" cy="80" rx="10" ry="3" fill="#FFFFFF" opacity="0.8"/>
  </g>
  <!-- Brillo -->
  <path d="M 28 36 A 30 30 0 0 1 54 22 A 30 30 0 0 0 28 36 Z" fill="#FFFFFF" opacity="0.35"/>
</svg>
