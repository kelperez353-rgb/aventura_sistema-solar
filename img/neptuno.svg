<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100%" height="100%">
  <defs>
    <radialGradient id="nepGrad" cx="35%" cy="35%" r="65%">
      <stop offset="0%" stop-color="#4895EF"/>
      <stop offset="50%" stop-color="#3A0CA3"/>
      <stop offset="85%" stop-color="#1B1A55"/>
      <stop offset="100%" stop-color="#0B092B"/>
    </radialGradient>
    <clipPath id="nepClip">
      <circle cx="50" cy="50" r="28"/>
    </clipPath>
  </defs>

  <!-- Atmósfera fría exterior -->
  <circle cx="50" cy="50" r="31" fill="#4895EF" opacity="0.25"/>

  <!-- Planeta Neptuno -->
  <circle cx="50" cy="50" r="28" fill="url(#nepGrad)"/>

  <!-- Tormentas y nubes de metano congelado -->
  <g clip-path="url(#nepClip)">
    <!-- Gran Mancha Oscura de Neptuno -->
    <ellipse cx="62" cy="46" rx="6" ry="3.5" fill="#070A3D" opacity="0.8"/>
    <!-- Nubes blancas cirros -->
    <path d="M 28 38 Q 45 35, 66 40" stroke="#E0F2FE" stroke-width="2.5" stroke-linecap="round" fill="none" opacity="0.75"/>
    <path d="M 35 62 Q 52 58, 72 63" stroke="#E0F2FE" stroke-width="2.5" stroke-linecap="round" fill="none" opacity="0.6"/>
    <path d="M 25 50 Q 38 52, 48 49" stroke="#E0F2FE" stroke-width="1.8" stroke-linecap="round" fill="none" opacity="0.5"/>
  </g>

  <!-- Brillo -->
  <path d="M 34 36 A 26 26 0 0 1 58 24 A 26 26 0 0 0 34 36 Z" fill="#FFFFFF" opacity="0.35"/>
</svg>
