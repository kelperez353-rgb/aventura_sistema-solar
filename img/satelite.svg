<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100%" height="100%">
  <!-- Cuerpo central del satélite -->
  <rect x="42" y="42" width="16" height="16" rx="3" fill="#E2E8F0" stroke="#5B4BCE" stroke-width="2"/>
  <!-- Antena / Plato parabólico -->
  <path d="M 50 34 A 8 8 0 0 1 50 42" stroke="#FFD166" stroke-width="2.5" fill="none"/>
  <line x1="50" y1="34" x2="50" y2="28" stroke="#FFD166" stroke-width="2"/>
  <circle cx="50" cy="27" r="2.5" fill="#FFD166"/>
  
  <!-- Panel solar izquierdo -->
  <line x1="42" y1="50" x2="20" y2="50" stroke="#CBD5E1" stroke-width="2.5"/>
  <rect x="10" y="40" width="22" height="20" rx="2" fill="#0077B6" stroke="#5B4BCE" stroke-width="1.5"/>
  <line x1="10" y1="50" x2="32" y2="50" stroke="#90E0EF" stroke-width="1"/>
  <line x1="21" y1="40" x2="21" y2="60" stroke="#90E0EF" stroke-width="1"/>

  <!-- Panel solar derecho -->
  <line x1="58" y1="50" x2="80" y2="50" stroke="#CBD5E1" stroke-width="2.5"/>
  <rect x="68" y="40" width="22" height="20" rx="2" fill="#0077B6" stroke="#5B4BCE" stroke-width="1.5"/>
  <line x1="68" y1="50" x2="90" y2="50" stroke="#90E0EF" stroke-width="1"/>
  <line x1="79" y1="40" x2="79" y2="60" stroke="#90E0EF" stroke-width="1"/>

  <!-- Destello de señal -->
  <path d="M 44 22 A 12 12 0 0 1 56 22" stroke="#FFD166" stroke-width="1.5" stroke-linecap="round" fill="none" opacity="0.8"/>
  <path d="M 40 17 A 18 18 0 0 1 60 17" stroke="#FFD166" stroke-width="1.5" stroke-linecap="round" fill="none" opacity="0.5"/>
</svg>
