<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 850 480" width="100%" height="100%">
  <defs>
    <!-- Filtro sombra suave -->
    <filter id="softShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="6" stdDeviation="6" flood-color="#000" flood-opacity="0.35"/>
    </filter>
    <radialGradient id="sunGrad" cx="40%" cy="40%" r="60%">
      <stop offset="0%" stop-color="#FFF275"/>
      <stop offset="65%" stop-color="#FFD166"/>
      <stop offset="100%" stop-color="#F39C12"/>
    </radialGradient>
    <radialGradient id="mercuryGrad" cx="40%" cy="40%" r="60%">
      <stop offset="0%" stop-color="#E2E8F0"/>
      <stop offset="100%" stop-color="#94A3B8"/>
    </radialGradient>
    <radialGradient id="venusGrad" cx="40%" cy="40%" r="60%">
      <stop offset="0%" stop-color="#FED7AA"/>
      <stop offset="60%" stop-color="#FDBA74"/>
      <stop offset="100%" stop-color="#FB923C"/>
    </radialGradient>
    <radialGradient id="earthGrad" cx="35%" cy="35%" r="65%">
      <stop offset="0%" stop-color="#67E8F9"/>
      <stop offset="60%" stop-color="#06B6D4"/>
      <stop offset="100%" stop-color="#0284C7"/>
    </radialGradient>
    <radialGradient id="marsGrad" cx="40%" cy="40%" r="60%">
      <stop offset="0%" stop-color="#FCA5A5"/>
      <stop offset="60%" stop-color="#F87171"/>
      <stop offset="100%" stop-color="#EF4444"/>
    </radialGradient>
    <radialGradient id="jupiterGrad" cx="40%" cy="35%" r="65%">
      <stop offset="0%" stop-color="#FEF08A"/>
      <stop offset="50%" stop-color="#FDE047"/>
      <stop offset="100%" stop-color="#EAB308"/>
    </radialGradient>
    <radialGradient id="saturnGrad" cx="40%" cy="35%" r="65%">
      <stop offset="0%" stop-color="#FEF9C3"/>
      <stop offset="60%" stop-color="#FDE68A"/>
      <stop offset="100%" stop-color="#F59E0B"/>
    </radialGradient>
    <radialGradient id="uranusGrad" cx="40%" cy="35%" r="65%">
      <stop offset="0%" stop-color="#A5F3FC"/>
      <stop offset="70%" stop-color="#67E8F9"/>
      <stop offset="100%" stop-color="#22D3EE"/>
    </radialGradient>
    <radialGradient id="neptuneGrad" cx="40%" cy="35%" r="65%">
      <stop offset="0%" stop-color="#93C5FD"/>
      <stop offset="70%" stop-color="#60A5FA"/>
      <stop offset="100%" stop-color="#3B82F6"/>
    </radialGradient>
    <linearGradient id="cometTail" x1="100%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFD166" stop-opacity="0.9"/>
      <stop offset="40%" stop-color="#60A5FA" stop-opacity="0.6"/>
      <stop offset="100%" stop-color="#5B4BCE" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <!-- ==========================================
       ESTRELLAS DE FONDO Y COMETA
       ========================================== -->
  <!-- Cometa en la parte superior derecha -->
  <g transform="translate(680, 50) rotate(-32)">
    <polygon points="0,-6 70,-2 130,0 70,2 0,6" fill="url(#cometTail)"/>
    <circle cx="130" cy="0" r="9" fill="#FFD166"/>
    <circle cx="130" cy="0" r="5" fill="#FFFFFF"/>
  </g>

  <!-- Estrellas amarillas brillantes -->
  <polygon points="120,60 123,69 132,72 123,75 120,84 117,75 108,72 117,69" fill="#FFD166"/>
  <polygon points="460,50 463,58 471,61 463,64 460,72 457,64 449,61 457,58" fill="#FFD166"/>
  <polygon points="760,80 762,86 768,88 762,90 760,96 758,90 752,88 758,86" fill="#FFD166"/>
  <polygon points="530,220 532,225 537,227 532,229 530,234 528,229 523,227 528,225" fill="#FFD166"/>
  <polygon points="730,410 732,415 737,417 732,419 730,424 728,419 723,417 728,415" fill="#FFD166"/>
  <circle cx="280" cy="90" r="2.5" fill="#FFFFFF" opacity="0.8"/>
  <circle cx="620" cy="110" r="2" fill="#FFFFFF" opacity="0.8"/>
  <circle cx="360" cy="420" r="3" fill="#FFD166" opacity="0.7"/>

  <!-- ==========================================
       LÍNEAS DE ÓRBITAS ELÍPTICAS (PERSPECTIVA)
       ========================================== -->
  <g fill="none" stroke="#253A7A" stroke-width="2" opacity="0.9">
    <!-- Órbita Mercurio -->
    <ellipse cx="230" cy="270" rx="90" ry="45" transform="rotate(-6 230 270)"/>
    <!-- Órbita Venus -->
    <ellipse cx="260" cy="270" rx="145" ry="68" transform="rotate(-6 260 270)"/>
    <!-- Órbita Tierra -->
    <ellipse cx="300" cy="270" rx="200" ry="90" transform="rotate(-6 300 270)"/>
    <!-- Órbita Marte -->
    <ellipse cx="340" cy="270" rx="255" ry="110" transform="rotate(-6 340 270)"/>
    <!-- Órbita Júpiter -->
    <ellipse cx="400" cy="270" rx="335" ry="138" transform="rotate(-6 400 270)"/>
    <!-- Órbita Saturno -->
    <ellipse cx="460" cy="270" rx="420" ry="165" transform="rotate(-6 460 270)"/>
    <!-- Órbita Urano -->
    <ellipse cx="510" cy="270" rx="490" ry="190" transform="rotate(-6 510 270)"/>
    <!-- Órbita Neptuno -->
    <ellipse cx="550" cy="270" rx="550" ry="210" transform="rotate(-6 550 270)"/>
  </g>

  <!-- ==========================================
       1. EL SOL (CARITA SONRIENTE AMIGABLE)
       ========================================== -->
  <g transform="translate(140, 200)" filter="url(#softShadow)">
    <!-- Rayos redondeados del Sol -->
    <g fill="#FFD166">
      <path d="M 0 -78 C 8 -78, 12 -65, 0 -60 C -12 -65, -8 -78, 0 -78 Z"/>
      <path d="M 55 -55 C 62 -50, 58 -38, 45 -42 C 40 -52, 48 -58, 55 -55 Z"/>
      <path d="M 78 0 C 78 8, 65 12, 60 0 C 65 -12, 78 -8, 78 0 Z"/>
      <path d="M 55 55 C 50 62, 38 58, 42 45 C 52 40, 58 48, 55 55 Z"/>
      <path d="M 0 78 C -8 78, -12 65, 0 60 C 12 65, 8 78, 0 78 Z"/>
      <path d="M -55 55 C -62 50, -58 38, -45 42 C -40 52, -48 58, -55 55 Z"/>
      <path d="M -78 0 C -78 -8, -65 -12, -60 0 C -65 12, -78 8, -78 0 Z"/>
      <path d="M -55 -55 C -50 -62, -38 -58, -42 -45 C -52 -40, -58 -48, -55 -55 Z"/>
      <!-- Rayos intermedios suaves -->
      <circle cx="28" cy="-66" r="8"/>
      <circle cx="68" cy="-26" r="8"/>
      <circle cx="68" cy="26" r="8"/>
      <circle cx="28" cy="66" r="8"/>
      <circle cx="-28" cy="66" r="8"/>
      <circle cx="-68" cy="26" r="8"/>
      <circle cx="-68" cy="-26" r="8"/>
      <circle cx="-28" cy="-66" r="8"/>
    </g>

    <!-- Cuerpo principal del Sol -->
    <circle cx="0" cy="0" r="58" fill="url(#sunGrad)"/>

    <!-- Cejitas simpáticas -->
    <path d="M -24 -24 Q -16 -28 -8 -22" stroke="#854D0E" stroke-width="3" stroke-linecap="round" fill="none"/>
    <path d="M 8 -22 Q 16 -28 24 -24" stroke="#854D0E" stroke-width="3" stroke-linecap="round" fill="none"/>

    <!-- Ojos grandes y adorables -->
    <ellipse cx="-16" cy="-10" rx="8" ry="12" fill="#1E293B"/>
    <ellipse cx="16" cy="-10" rx="8" ry="12" fill="#1E293B"/>
    <!-- Brillos oculares -->
    <circle cx="-18" cy="-14" r="3.5" fill="#FFFFFF"/>
    <circle cx="-14" cy="-7" r="1.5" fill="#FFFFFF"/>
    <circle cx="14" cy="-14" r="3.5" fill="#FFFFFF"/>
    <circle cx="18" cy="-7" r="1.5" fill="#FFFFFF"/>

    <!-- Mejillas sonrosadas -->
    <circle cx="-28" cy="4" r="7" fill="#F87171" opacity="0.6"/>
    <circle cx="28" cy="4" r="7" fill="#F87171" opacity="0.6"/>

    <!-- Boca sonriente abierta y alegre -->
    <path d="M -14 6 Q 0 24 14 6 Z" fill="#991B1B"/>
    <!-- Lengüita rosada -->
    <path d="M -8 15 Q 0 12 8 15 Q 0 24 -8 15 Z" fill="#F472B6"/>
  </g>

  <!-- ==========================================
       2. MERCURIO (GRIS TIERNO)
       ========================================== -->
  <g transform="translate(198, 305)" filter="url(#softShadow)">
    <circle cx="0" cy="0" r="13" fill="url(#mercuryGrad)"/>
    <!-- Cráter sutil -->
    <circle cx="-5" cy="-5" r="2.5" fill="#64748B" opacity="0.4"/>
    <!-- Carita -->
    <circle cx="-4" cy="-1" r="2" fill="#1E293B"/>
    <circle cx="4" cy="-1" r="2" fill="#1E293B"/>
    <circle cx="-5" cy="-2" r="0.8" fill="#FFF"/>
    <circle cx="3" cy="-2" r="0.8" fill="#FFF"/>
    <!-- Mejillas -->
    <circle cx="-7" cy="3" r="2" fill="#F87171" opacity="0.5"/>
    <circle cx="7" cy="3" r="2" fill="#F87171" opacity="0.5"/>
    <!-- Sonrisa -->
    <path d="M -3 3 Q 0 6 3 3" stroke="#1E293B" stroke-width="1.2" stroke-linecap="round" fill="none"/>
  </g>

  <!-- ==========================================
       3. VENUS (AMARILLO DORADO)
       ========================================== -->
  <g transform="translate(245, 298)" filter="url(#softShadow)">
    <circle cx="0" cy="0" r="18" fill="url(#venusGrad)"/>
    <!-- Carita tierna -->
    <circle cx="-5" cy="-2" r="2.3" fill="#1E293B"/>
    <circle cx="5" cy="-2" r="2.3" fill="#1E293B"/>
    <circle cx="-6" cy="-3" r="1" fill="#FFF"/>
    <circle cx="4" cy="-3" r="1" fill="#FFF"/>
    <!-- Mejillas -->
    <circle cx="-10" cy="3" r="2.5" fill="#EA580C" opacity="0.4"/>
    <circle cx="10" cy="3" r="2.5" fill="#EA580C" opacity="0.4"/>
    <!-- Sonrisa -->
    <path d="M -4 3 Q 0 8 4 3" stroke="#1E293B" stroke-width="1.5" stroke-linecap="round" fill="none"/>
  </g>

  <!-- ==========================================
       4. TIERRA (AZUL CON CONTINENTES Y SONRISA)
       ========================================== -->
  <g transform="translate(305, 290)" filter="url(#softShadow)">
    <circle cx="0" cy="0" r="22" fill="url(#earthGrad)"/>
    <!-- Continentes verdes -->
    <path d="M -14 -8 C -10 -15, -4 -16, 2 -12 C 0 -6, -8 -4, -14 -8 Z" fill="#22C55E" opacity="0.85"/>
    <path d="M -18 4 C -12 2, -10 12, -16 16 Z" fill="#22C55E" opacity="0.85"/>
    <path d="M 8 -4 C 16 -8, 20 2, 14 8 C 8 8, 6 0, 8 -4 Z" fill="#22C55E" opacity="0.85"/>
    <!-- Carita -->
    <circle cx="-6" cy="-2" r="2.6" fill="#0F172A"/>
    <circle cx="6" cy="-2" r="2.6" fill="#0F172A"/>
    <circle cx="-7" cy="-3.5" r="1.1" fill="#FFF"/>
    <circle cx="5" cy="-3.5" r="1.1" fill="#FFF"/>
    <!-- Mejillas -->
    <circle cx="-12" cy="4" r="3" fill="#F43F5E" opacity="0.5"/>
    <circle cx="12" cy="4" r="3" fill="#F43F5E" opacity="0.5"/>
    <!-- Sonrisa abierta -->
    <path d="M -5 3 Q 0 9 5 3 Z" fill="#991B1B"/>
  </g>

  <!-- ==========================================
       5. MARTE (ROJO SIMPÁTICO)
       ========================================== -->
  <g transform="translate(365, 275)" filter="url(#softShadow)">
    <circle cx="0" cy="0" r="17" fill="url(#marsGrad)"/>
    <!-- Carita -->
    <circle cx="-5" cy="-2" r="2.2" fill="#1E293B"/>
    <circle cx="5" cy="-2" r="2.2" fill="#1E293B"/>
    <circle cx="-6" cy="-3" r="0.9" fill="#FFF"/>
    <circle cx="4" cy="-3" r="0.9" fill="#FFF"/>
    <!-- Mejillas -->
    <circle cx="-9" cy="3" r="2.5" fill="#991B1B" opacity="0.4"/>
    <circle cx="9" cy="3" r="2.5" fill="#991B1B" opacity="0.4"/>
    <!-- Sonrisa -->
    <path d="M -4 3 Q 0 7 4 3" stroke="#1E293B" stroke-width="1.4" stroke-linecap="round" fill="none"/>
  </g>

  <!-- ==========================================
       6. JÚPITER (GIGANTE FRANJAS PASTEL Y SONRISA)
       ========================================== -->
  <g transform="translate(445, 255)" filter="url(#softShadow)">
    <clipPath id="jupBall">
      <circle cx="0" cy="0" r="38"/>
    </clipPath>
    <!-- Base Júpiter -->
    <circle cx="0" cy="0" r="38" fill="url(#jupiterGrad)"/>
    <!-- Franjas sutiles -->
    <g clip-path="url(#jupBall)" opacity="0.5">
      <path d="M -40 -20 Q 0 -15 40 -20 L 40 -10 Q 0 -5 -40 -10 Z" fill="#F97316"/>
      <path d="M -40 5 Q 0 10 40 5 L 40 18 Q 0 22 -40 18 Z" fill="#C2410C"/>
      <ellipse cx="22" cy="18" rx="7" ry="4.5" fill="#DC2626"/>
    </g>
    <!-- Carita -->
    <circle cx="-10" cy="-4" r="4" fill="#1E293B"/>
    <circle cx="10" cy="-4" r="4" fill="#1E293B"/>
    <circle cx="-12" cy="-6" r="1.5" fill="#FFF"/>
    <circle cx="8" cy="-6" r="1.5" fill="#FFF"/>
    <!-- Mejillas -->
    <circle cx="-19" cy="4" r="4.5" fill="#EA580C" opacity="0.5"/>
    <circle cx="19" cy="4" r="4.5" fill="#EA580C" opacity="0.5"/>
    <!-- Sonrisa alegre -->
    <path d="M -8 5 Q 0 14 8 5 Z" fill="#991B1B"/>
  </g>

  <!-- ==========================================
       7. SATURNO (DORADO CON GRAN ANILLO Y CARITA)
       ========================================== -->
  <g transform="translate(560, 245)" filter="url(#softShadow)">
    <!-- Parte trasera del anillo -->
    <g transform="rotate(-15)">
      <ellipse cx="0" cy="0" rx="60" ry="16" fill="none" stroke="#FDE68A" stroke-width="9" opacity="0.9"/>
      <ellipse cx="0" cy="0" rx="50" ry="12" fill="none" stroke="#F59E0B" stroke-width="3" opacity="0.8"/>
    </g>
    <!-- Cuerpo de Saturno -->
    <circle cx="0" cy="0" r="30" fill="url(#saturnGrad)"/>
    <!-- Parte frontal del anillo -->
    <g transform="rotate(-15)">
      <path d="M -60 0 A 60 16 0 0 0 60 0" fill="none" stroke="#FDE68A" stroke-width="9" opacity="0.95"/>
      <path d="M -50 0 A 50 12 0 0 0 50 0" fill="none" stroke="#F59E0B" stroke-width="3" opacity="0.85"/>
    </g>
    <!-- Carita -->
    <circle cx="-8" cy="-5" r="3.2" fill="#1E293B"/>
    <circle cx="8" cy="-5" r="3.2" fill="#1E293B"/>
    <circle cx="-9.5" cy="-6.5" r="1.2" fill="#FFF"/>
    <circle cx="6.5" cy="-6.5" r="1.2" fill="#FFF"/>
    <!-- Mejillas -->
    <circle cx="-15" cy="2" r="3.5" fill="#EA580C" opacity="0.5"/>
    <circle cx="15" cy="2" r="3.5" fill="#EA580C" opacity="0.5"/>
    <!-- Sonrisa -->
    <path d="M -6 3 Q 0 10 6 3" stroke="#1E293B" stroke-width="2" stroke-linecap="round" fill="none"/>
  </g>

  <!-- ==========================================
       8. URANO (CIAN SUAVE Y SONRIENTE)
       ========================================== -->
  <g transform="translate(660, 275)" filter="url(#softShadow)">
    <!-- Anillo tenue inclinado -->
    <ellipse cx="0" cy="0" rx="8" ry="34" fill="none" stroke="#E0F2FE" stroke-width="3" opacity="0.75" transform="rotate(35)"/>
    <!-- Cuerpo Urano -->
    <circle cx="0" cy="0" r="22" fill="url(#uranusGrad)"/>
    <!-- Carita -->
    <circle cx="-6" cy="-2" r="2.8" fill="#0F172A"/>
    <circle cx="6" cy="-2" r="2.8" fill="#0F172A"/>
    <circle cx="-7.5" cy="-3.5" r="1.1" fill="#FFF"/>
    <circle cx="4.5" cy="-3.5" r="1.1" fill="#FFF"/>
    <!-- Mejillas -->
    <circle cx="-12" cy="4" r="3" fill="#0284C7" opacity="0.4"/>
    <circle cx="12" cy="4" r="3" fill="#0284C7" opacity="0.4"/>
    <!-- Sonrisa -->
    <path d="M -5 3 Q 0 8 5 3" stroke="#0F172A" stroke-width="1.6" stroke-linecap="round" fill="none"/>
  </g>

  <!-- ==========================================
       9. NEPTUNO (AZUL PROFUNDO Y SONRIENTE)
       ========================================== -->
  <g transform="translate(740, 275)" filter="url(#softShadow)">
    <circle cx="0" cy="0" r="21" fill="url(#neptuneGrad)"/>
    <!-- Carita -->
    <circle cx="-6" cy="-2" r="2.6" fill="#0F172A"/>
    <circle cx="6" cy="-2" r="2.6" fill="#0F172A"/>
    <circle cx="-7.2" cy="-3.2" r="1" fill="#FFF"/>
    <circle cx="4.8" cy="-3.2" r="1" fill="#FFF"/>
    <!-- Mejillas -->
    <circle cx="-11" cy="4" r="2.8" fill="#1D4ED8" opacity="0.45"/>
    <circle cx="11" cy="4" r="2.8" fill="#1D4ED8" opacity="0.45"/>
    <!-- Sonrisa -->
    <path d="M -4 3 Q 0 7 4 3" stroke="#0F172A" stroke-width="1.6" stroke-linecap="round" fill="none"/>
  </g>
</svg>
